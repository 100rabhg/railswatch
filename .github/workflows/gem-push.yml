name: Release Gem

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/ruby.yml

  publish:
    name: Build + Publish
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1